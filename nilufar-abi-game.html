<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd6e5">
<title>نیلوفرهای آبی | بازی مجموعه‌ها و احتمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light;min-height:100%;background:linear-gradient(165deg,#fff3b0 0%,#ffd6e5 52%,#cdeffd 100%) fixed}
body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;color:#142a4d;line-height:1.7;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.4;
 background-image:radial-gradient(#ff6f91 0 4px,transparent 5px),radial-gradient(#35c7e0 0 3px,transparent 4px),radial-gradient(#a78bfa 0 4px,transparent 5px),radial-gradient(#fff 0 6px,transparent 7px);
 background-size:190px 190px,150px 150px,230px 230px,110px 110px;
 background-position:10px 20px,90px 70px,150px 130px,40px 90px}
button{font-family:inherit;color:inherit}
.app{max-width:920px;margin:0 auto;padding:10px 10px 26px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}

/* نوار بالا */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logo-chip{background:#fcf9f6;border-radius:12px;border:2px solid #fff;box-shadow:0 3px 0 rgba(20,42,77,.16);display:flex;align-items:center;padding:2px 8px}
.logo-chip img{height:38px;width:auto;display:block}
.logo-chip.big{display:inline-flex;padding:6px 14px;border-radius:20px;box-shadow:0 5px 0 rgba(20,42,77,.14)}
.logo-chip.big img{height:clamp(120px,34vw,170px)}
.pills{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.pill{background:#fff;border-radius:999px;padding:2px 11px;font-weight:800;font-size:.92rem;border-bottom:3px solid rgba(20,42,77,.16);white-space:nowrap}
.mute{width:38px;height:34px;border-radius:999px;border:0;border-bottom:3px solid rgba(20,42,77,.16);background:#fff;font-size:1rem;cursor:pointer}
.pips{display:flex;gap:2px;margin:0 2px 4px;height:10px}
.pip{flex:1;border-radius:4px;background:rgba(255,255,255,.75)}
.pip.gap{margin-inline-start:5px}
.pip.ok{background:#27ae60}.pip.no{background:#ff5d7a}.pip.cur{background:#142a4d}
.stline{font-size:.82rem;font-weight:700;margin:0 4px 6px;min-height:1.5em;color:#0b6f8f}

/* صحنه */
.scene{position:relative;border-radius:22px;overflow:hidden;border:4px solid #fff;box-shadow:0 7px 0 rgba(14,143,176,.28),0 14px 28px rgba(20,42,77,.14);background:#8fe3f0}
#cv{display:block;width:100%;height:210px}
.banner{position:absolute;top:10px;inset-inline:0;margin:auto;width:max-content;max-width:92%;background:rgba(255,255,255,.95);border-radius:999px;padding:3px 16px;font-family:Lalezar,Vazirmatn,sans-serif;font-size:1.1rem;box-shadow:0 3px 0 rgba(20,42,77,.18);opacity:0;pointer-events:none}
.banner.show{animation:ban 2.8s ease both}
@keyframes ban{0%{opacity:0;transform:translateY(-14px) scale(.92)}12%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* کارت */
.card{background:#fff;border-radius:22px;padding:14px 14px 18px;margin-top:12px;box-shadow:0 6px 0 rgba(20,42,77,.12);transition:opacity .25s;overflow-wrap:anywhere}
.card.swap{opacity:0;pointer-events:none}
.qhead{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#eaf7fc;border-radius:999px;padding:1px 12px;font-size:.82rem;font-weight:800}
.chip.st{background:var(--c)}
.qt{margin:10px 0 8px;font-size:clamp(1.02rem,3.7vw,1.2rem);font-weight:700;line-height:2.05}
.given{background:#f1fbff;border:2px dashed #7fd1e6;border-radius:14px;padding:6px 12px;margin:6px 0 10px;text-align:center;font-size:1.02rem}
.m{display:inline-block;direction:ltr;unicode-bidi:isolate;max-width:100%;font-weight:800;letter-spacing:.03em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1.25;margin:0 3px}
.fr i{font-style:normal;text-align:center;padding:0 5px;display:block}
.fr i:first-child{border-bottom:2px solid currentColor}
.opts{display:grid;gap:9px;margin-top:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:start;min-height:52px;padding:8px 12px;background:#fff;border:2.5px solid #cfe3ee;border-bottom-width:5px;border-radius:16px;font-size:1.02rem;font-weight:700;cursor:pointer;transition:transform .08s,background .15s}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:3px}
.opt:disabled{cursor:default}
.opt .bd{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;background:#bdeefa}
.opt:nth-child(2) .bd{background:#ffd0dc}.opt:nth-child(3) .bd{background:#e0d4ff}.opt:nth-child(4) .bd{background:#ffe7a3}
.opt.ok{background:#e3f8ea;border-color:#1f9d55}.opt.no{background:#ffe6eb;border-color:#d93c5a}.opt.dim{opacity:.5}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-family:Lalezar,Vazirmatn,sans-serif;font-size:1.25rem;font-weight:400}
.venn{display:block;width:100%;max-width:390px;margin:6px auto 2px;touch-action:manipulation}
.rg{fill:#fff;fill-opacity:.001;cursor:pointer;outline:none}
.rg:hover{fill:#ffd23f;fill-opacity:.35}
.rg:focus-visible{stroke:#142a4d;stroke-width:3;stroke-dasharray:5 4}
.rg.on{fill:url(#hat);fill-opacity:1}
.mk{fill:none;pointer-events:none;stroke-width:4.5}
.mk.good{stroke:#1f9d55}.mk.bad{stroke:#d93c5a;stroke-dasharray:7 5}
.vl{font:800 22px Vazirmatn,Tahoma,sans-serif;fill:#142a4d}
.pn{cursor:pointer;outline:none}
.pn circle{fill:#fff;stroke:#142a4d;stroke-width:2.5}
.pn text{font:800 15px Vazirmatn,Tahoma,sans-serif;fill:#142a4d;direction:ltr}
.pn:focus-visible circle{stroke-dasharray:4 3}
.pn.ok circle{fill:#d6f5e1;stroke:#1f9d55}.pn.fix circle{fill:#ffe3b3;stroke:#e08a00}
.hint{font-size:.85rem;text-align:center;color:#0b6f8f;font-weight:700;margin:2px 0 6px}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px;align-items:center}
.nchip{min-width:50px;height:50px;border-radius:14px;border:2.5px solid #cfe3ee;border-bottom-width:5px;background:#fff;font:800 1.15rem Vazirmatn,Tahoma,sans-serif;cursor:pointer}
.nchip.sel{background:#ffe27a;border-color:#e0a800;transform:translateY(-3px)}
.tray .done{font-weight:700;color:#1f9d55}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.mcard{min-height:50px;border-radius:14px;border:2.5px solid #cfe3ee;border-bottom-width:5px;background:#fff;font-size:1rem;font-weight:800;cursor:pointer;padding:4px 6px}
.mcard.on{background:#fff1a8;border-color:#e0a800}
.mcard.ok{background:#e3f8ea;border-color:#1f9d55}.mcard.no{background:#ffe6eb;border-color:#d93c5a}
.mcard.miss{background:#fff;border:2.5px dashed #1f9d55;border-bottom-width:5px}.mcard.dim{opacity:.45}
.mcount{text-align:center;font-size:.88rem;font-weight:700;margin-top:6px;color:#0b6f8f}
.jar{display:flex;justify-content:center;margin:2px 0 4px}.jar svg{width:100%;max-width:250px;height:auto}
.go{display:block;width:100%;margin-top:14px;padding:11px 20px;min-height:52px;border:0;border-bottom:5px solid #d99a00;border-radius:16px;background:#ffd23f;color:#142a4d;font-family:Lalezar,Vazirmatn,sans-serif;font-size:1.3rem;cursor:pointer}
.go:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.go:disabled{background:#e9e4d2;border-bottom-color:#cfc9b3;color:#8b8874;cursor:not-allowed}
.go.big{font-size:1.45rem;min-height:58px}
.fb{margin-top:14px;padding:12px 14px 14px;border-radius:16px;border:2.5px solid}
.fb.ok{background:#e9faef;border-color:#1f9d55}.fb.no{background:#fff0f3;border-color:#d93c5a}
.fbt{font-family:Lalezar,Vazirmatn,sans-serif;font-size:1.4rem;line-height:1.5}
.fbt .pt{display:inline-block;background:#ffd23f;border-radius:999px;padding:0 10px;font-size:1rem}
.streak{font-weight:800;color:#c2410c}
.ans{font-weight:800;margin-top:2px}
.why{margin-top:4px;font-size:.97rem;line-height:1.95}
button:focus-visible,.nchip:focus-visible,input:focus-visible{outline:3px solid #142a4d;outline-offset:2px}
/* شروع و پایان */
.start,.end{text-align:center}
.start h1,.end h2{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:clamp(2.1rem,9vw,2.9rem);margin:8px 0 0;line-height:1.35}
.sub{margin:0 0 6px;font-weight:700;color:#0b6f8f}
.how{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px;text-align:start}
.how li{background:#f1fbff;border-radius:14px;padding:8px 12px;font-size:.95rem;line-height:1.9}
.nm{display:block;margin-top:6px;font-weight:700}
.nm input{display:block;margin:4px auto 0;font:inherit;padding:10px 14px;border-radius:14px;border:2.5px solid #cfe3ee;width:100%;max-width:300px;text-align:center;background:#fff}
.by{margin:12px 0 0;font-weight:800;color:#0b6f8f}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.stars svg{width:54px;height:54px;fill:#e5e9ee;stroke:#c9d1da;stroke-width:1}
.stars svg.on{fill:#ffc61a;stroke:#d99a00}
.msg{font-weight:700;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stats div{background:#f1fbff;border-radius:14px;padding:6px 4px}
.stats b{display:block;font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:1.7rem;line-height:1.3}
.stats span{font-size:.8rem;font-weight:700}
.rv{text-align:start;margin-top:10px;background:#fff8f9;border:2px solid #ffd0da;border-radius:14px;padding:6px 12px}
.rv summary{font-weight:800;cursor:pointer;min-height:36px;display:flex;align-items:center}
.rv ol{padding-inline-start:20px;margin:6px 0}
.rv li{margin-bottom:10px;font-size:.93rem}
.ra{font-weight:800;color:#1f7a45}
.foot{text-align:center;font-size:.82rem;font-weight:700;margin-top:16px;color:#33507a}
@media (min-width:560px){.opts:not(.tf){grid-template-columns:1fr 1fr}.mgrid{grid-template-columns:repeat(3,1fr)}.card{padding:18px 22px 22px}}
@media (min-width:700px){#cv{height:340px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

{st:0,type:'tf',q:'عبارت «زیباترین پارک استان هرمزگان» یک مجموعه است.',a:false,

{st:0,type:'mc',q:'جای خالی را کامل کن: «اشتراک دو مجموعه، زیرمجموعهٔ ........ همان دو مجموعه است.»',

  btns.forEach(b=>{const k=+b.dataset.k,gd=good.has(k),sl=sel.has(k);b.classList.remove('on');
   if(gd&&sl)b.classList.add('ok');else if(gd){b.classList.add('miss');ok=false;}else if(sl){b.classList.add('no');ok=false;}else b.classList.add('dim');b.disabled=true;});
  finish(ok,'هر ۸ زیرمجموعه: تهی، سه تا تک‌عضوی، سه تا دوعضوی و خود مجموعه');
 };
}
